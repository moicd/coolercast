name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      # Releases are signed once SignPath is configured (see docs/signing.md).
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Version
        id: version
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq 'coolercast').version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match the crate version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Collect executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item target/release/coolercast.exe, target/release/coolercast-app.exe bin

      - uses: actions/upload-artifact@v7
        id: unsigned
        with:
          name: windows-executables
          path: bin/

      - name: Sign executables
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: coolercast
          signing-policy-slug: release-signing
          artifact-configuration-slug: executables
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000 # stay below the 6 h job limit
          output-artifact-directory: bin

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 6.0.2
          wix extension add --global WixToolset.UI.wixext/6.0.2

      - name: Package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          wix build packaging/windows/coolercast.wxs -arch x64 -ext WixToolset.UI.wixext `
            -d Version=$version -d BinDir=bin -o dist/coolercast-windows-x64.msi
          if ($LASTEXITCODE) { throw "wix build failed" }
          Remove-Item dist/coolercast-windows-x64.wixpdb

          $portable = "portable/CoolerCast"
          New-Item -ItemType Directory -Force "$portable/modules" | Out-Null
          Copy-Item bin/*.exe, README.md, LICENSE $portable
          Copy-Item third_party/pawnio-modules/*.bin, third_party/pawnio-modules/COPYING "$portable/modules"
          Compress-Archive -Path "$portable/*" -DestinationPath dist/coolercast-windows-x64.zip

      - uses: actions/upload-artifact@v7
        id: installers
        with:
          name: windows-installers
          path: dist/*.msi

      - name: Sign installers
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: coolercast
          signing-policy-slug: release-signing
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.installers.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: dist

      - name: Test the installer
        shell: pwsh
        run: |
          $msi = Resolve-Path dist/coolercast-windows-x64.msi
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'install.log' -Wait -PassThru
          if ($p.ExitCode) { Get-Content install.log -Tail 50; throw "install failed: $($p.ExitCode)" }
          Start-Sleep -Seconds 3
          $cli = "$env:ProgramFiles\CoolerCast\coolercast.exe"
          if ((Get-Service coolercast).Status -ne 'Running') { throw "the service is not running" }
          & $cli status; if ($LASTEXITCODE) { throw "status failed" }
          & $cli set mode=usage
          if (-not (& $cli status | Select-String '^mode\s+usage')) { throw "set did not apply" }
          $p = Start-Process msiexec -ArgumentList '/x', "`"$msi`"", '/qn' -Wait -PassThru
          if ($p.ExitCode) { throw "uninstall failed: $($p.ExitCode)" }
          if (Get-Service coolercast -ErrorAction SilentlyContinue) { throw "the service was not removed" }

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist/

  linux:
    runs-on: ubuntu-24.04
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}

      - name: Clippy
        run: cargo clippy --target "$TARGET" --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --target "$TARGET" --locked

      - name: Build
        run: cargo build --release --locked --target "$TARGET" -p coolercast

      - name: Package
        run: |
          mkdir -p pkg/coolercast dist
          cp "target/$TARGET/release/coolercast" packaging/linux/* README.md LICENSE pkg/coolercast/
          chmod 755 pkg/coolercast/coolercast pkg/coolercast/install.sh
          tar -C pkg -czf dist/coolercast-linux-x86_64.tar.gz coolercast
          echo "PKG=pkg/coolercast" >> "$GITHUB_ENV"

      - name: Test the install script
        run: |
          systemd-analyze verify "$PKG/coolercast.service" || true
          sudo "$PKG/install.sh"
          sleep 3
          systemctl is-active coolercast
          coolercast status
          coolercast set mode=usage
          coolercast status | grep -E '^mode +usage'
          sudo journalctl -u coolercast --no-pager | tail -n 20
          test -x /usr/local/share/coolercast/install.sh
          sudo /usr/local/share/coolercast/install.sh --uninstall
          ! systemctl is-active coolercast
          test ! -e /usr/local/bin/coolercast

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --title "CoolerCast ${GITHUB_REF_NAME#v}" --generate-notes
