name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Version
        id: version
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq 'coolercast').version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match the crate version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $dist = "dist/coolercast"
          New-Item -ItemType Directory -Force "$dist/modules" | Out-Null
          Copy-Item target/release/coolercast.exe, target/release/coolercast-app.exe, README.md, LICENSE $dist
          Copy-Item third_party/pawnio-modules/*.bin, third_party/pawnio-modules/COPYING "$dist/modules"

      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: coolercast-windows-x64
          path: dist/coolercast/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Sign with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: coolercast
          signing-policy-slug: release-signing
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          parameters: |
            version: "${{ needs.build.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000 # stay below the 6 h job limit
          output-artifact-directory: coolercast

      - name: Download unsigned build
        if: vars.SIGNPATH_ORGANIZATION_ID == ''
        uses: actions/download-artifact@v8
        with:
          name: coolercast-windows-x64
          path: coolercast

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path coolercast/* -DestinationPath coolercast-windows-x64.zip
          gh release create $env:GITHUB_REF_NAME coolercast-windows-x64.zip --repo $env:GITHUB_REPOSITORY --generate-notes
