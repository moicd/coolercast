name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      # Releases are signed once SignPath is configured (see docs/signing.md).
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Version
        id: version
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq 'coolercast').version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match the crate version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: |
          cargo build --release --locked
          cargo build --release --locked --target aarch64-pc-windows-msvc

      - name: Collect executables
        shell: pwsh
        run: |
          foreach ($arch in @{ x64 = 'target/release'; arm64 = 'target/aarch64-pc-windows-msvc/release' }.GetEnumerator()) {
            New-Item -ItemType Directory -Force "bin/$($arch.Key)" | Out-Null
            Copy-Item "$($arch.Value)/coolercast.exe", "$($arch.Value)/coolercast-app.exe" "bin/$($arch.Key)"
          }

      - uses: actions/upload-artifact@v7
        id: unsigned
        with:
          name: windows-executables
          path: bin/

      - name: Sign executables
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: coolercast
          signing-policy-slug: release-signing
          artifact-configuration-slug: executables
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000 # stay below the 6 h job limit
          output-artifact-directory: bin

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 6.0.2
          wix extension add --global WixToolset.UI.wixext/6.0.2

      - name: Package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($arch in 'x64', 'arm64') {
            wix build packaging/windows/coolercast.wxs -arch $arch -ext WixToolset.UI.wixext `
              -d Version=$version -d BinDir=bin/$arch -o "dist/coolercast-$version-windows-$arch.msi"
            if ($LASTEXITCODE) { throw "wix build failed for $arch" }
            Remove-Item "dist/coolercast-$version-windows-$arch.wixpdb"

            $portable = "portable/$arch/CoolerCast"
            New-Item -ItemType Directory -Force "$portable/modules" | Out-Null
            Copy-Item "bin/$arch/*.exe", README.md, LICENSE $portable
            Copy-Item third_party/pawnio-modules/*.bin, third_party/pawnio-modules/COPYING "$portable/modules"
            Compress-Archive -Path "$portable/*" -DestinationPath "dist/coolercast-$version-windows-$arch.zip"
          }

      - uses: actions/upload-artifact@v7
        id: installers
        with:
          name: windows-installers
          path: dist/*.msi

      - name: Sign installers
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: coolercast
          signing-policy-slug: release-signing
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.installers.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: dist

      - name: Test the installer
        shell: pwsh
        run: |
          $msi = Resolve-Path "dist/coolercast-*-windows-x64.msi"
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'install.log' -Wait -PassThru
          if ($p.ExitCode) { Get-Content install.log -Tail 50; throw "install failed: $($p.ExitCode)" }
          Start-Sleep -Seconds 3
          $cli = "$env:ProgramFiles\CoolerCast\coolercast.exe"
          if ((Get-Service coolercast).Status -ne 'Running') { throw "the service is not running" }
          & $cli status; if ($LASTEXITCODE) { throw "status failed" }
          & $cli set mode=usage
          if (-not (& $cli status | Select-String '^mode\s+usage')) { throw "set did not apply" }
          $p = Start-Process msiexec -ArgumentList '/x', "`"$msi`"", '/qn' -Wait -PassThru
          if ($p.ExitCode) { throw "uninstall failed: $($p.ExitCode)" }
          if (Get-Service coolercast -ErrorAction SilentlyContinue) { throw "the service was not removed" }

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist/

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}

      - name: Clippy
        run: cargo clippy --target "$TARGET" --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --target "$TARGET" --locked

      - name: Build
        run: cargo build --release --locked --target "$TARGET" -p coolercast

      - name: Package
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "coolercast") | .version')
          name="coolercast-$version-linux-${{ matrix.arch }}"
          mkdir -p "pkg/$name" dist
          cp "target/$TARGET/release/coolercast" packaging/linux/* README.md LICENSE "pkg/$name/"
          chmod 755 "pkg/$name/coolercast" "pkg/$name/install.sh"
          tar -C pkg -czf "dist/$name.tar.gz" "$name"
          echo "PKG=pkg/$name" >> "$GITHUB_ENV"

      - name: Test the install script
        run: |
          systemd-analyze verify "$PKG/coolercast.service" || true
          sudo "$PKG/install.sh"
          sleep 3
          systemctl is-active coolercast
          coolercast status
          coolercast set mode=usage
          coolercast status | grep -E '^mode +usage'
          sudo journalctl -u coolercast --no-pager | tail -n 20
          sudo "$PKG/install.sh" --uninstall
          ! systemctl is-active coolercast

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --title "CoolerCast ${GITHUB_REF_NAME#v}" --generate-notes
