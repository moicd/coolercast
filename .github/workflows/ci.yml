name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $dist = "dist/coolercast"
          New-Item -ItemType Directory -Force "$dist/modules" | Out-Null
          Copy-Item target/release/coolercast.exe, target/release/coolercast-app.exe, README.md, LICENSE $dist
          Copy-Item third_party/pawnio-modules/*.bin, third_party/pawnio-modules/COPYING "$dist/modules"
          Compress-Archive -Path "$dist/*" -DestinationPath dist/coolercast-windows-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: coolercast-windows-x64
          path: dist/coolercast-windows-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/coolercast-windows-x64.zip --generate-notes
