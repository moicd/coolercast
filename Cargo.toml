[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Moisés Casanova"]
repository = "https://github.com/moicd/coolercast"

[workspace.dependencies]
coolercast-core = { path = "crates/core" }
serde = { version = "1.0", features = ["derive"] }
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }
windows-service = "0.8"
windows-sys = "0.61"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
